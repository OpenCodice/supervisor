name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: actionlint
        # Antes de las pruebas: las de las compuertas del agente lo usan.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /tmp
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -color
      - run: python -m pytest -q
      - run: shellcheck scripts/agente/*.sh
      - name: Lint de rutas, lanzamientos, needs y tiempos
        run: python supervisor/lint_workflows.py .
