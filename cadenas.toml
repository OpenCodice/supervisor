# ---------------------------------------------------------------------------
# Workers de Cloudflare (I10). Cada uno contesta `GET salud` con su token, que
# se lee del entorno (`token_env`); sin él, I10 queda sin observar.
#
# forma   cómo se lee lo que contesta:
#         "cola" (por omisión): por sitio, cuántas páginas tiene pendientes,
#           desde cuándo y cuándo bajó la última.
#         "salida": `{"ok": true, "pais": "MX", "colo": …}`: está bien y dice
#           desde qué país sale.
# pais    con forma "salida": el país desde el que tiene que salir.
# ---------------------------------------------------------------------------

[[workers]]
nombre = "congreso-archivo"
repo = "congreso-extractor"
salud = "https://congreso-archivo.danielcardeenas.workers.dev/salud"
token_env = "CONGRESO_ARCHIVO_TOKEN"
forma = "cola"

# Descarga desde México las fuentes que rechazan conexiones de fuera. Si deja
# de salir desde México no sirve, aunque conteste.
[[workers]]
nombre = "egress-mx"
repo = "constitucion-extractor"
salud = "https://egress-mx.danielcardeenas.workers.dev/salud"
token_env = "EGRESS_MX_TOKEN"
forma = "salida"
pais = "MX"

# ---------------------------------------------------------------------------
# Credenciales que el supervisor usa en cada vuelta (I13). No las renueva: deja
# constancia en un issue, con este texto, antes de que venzan o cuando pierden
# un permiso, y lo cierra cuando ve que cambiaron.
#
# uso          "github": el token con el que habla con la API; su vencimiento
#              viene en la cabecera `github-authentication-token-expiration` de
#              cualquier respuesta. Sin `uso`, es el token de un `[[workers]]`
#              (el de su `token_env`).
# presente_env variable del entorno que vale `true` cuando el secret existe
#              (`supervisor.yml` la pone); `false` = la vuelta corrió con el
#              token del job, en modo informe.
# que, necesita, guardar   lo que dice el issue: qué es, qué permisos y repos
#              necesita el token nuevo y el comando exacto para guardarlo.
# ---------------------------------------------------------------------------

[[credenciales]]
nombre = "SUPERVISOR_TOKEN"
uso = "github"
presente_env = "ACTUA"
que = "PAT fine-grained `opencodice-supervisor`, secret del repo `supervisor`. Con él el supervisor observa la organización, lanza y cancela corridas, cierra un PR automático atorado y escribe estos issues."
necesita = "Dueño del recurso: la organización OpenCodice, con acceso a todos sus repositorios. Permisos de repositorio, todos de lectura y escritura: Actions, Contents, Workflows, Pull requests e Issues."
guardar = "gh secret set SUPERVISOR_TOKEN -R OpenCodice/supervisor"

[[credenciales]]
nombre = "CONGRESO_ARCHIVO_TOKEN"
que = "Token compartido con el Worker `congreso-archivo` (su secret `TOKEN`). El supervisor lee con él `GET /salud` (I10); `congreso-extractor` lo usa para pedir y leer páginas."
necesita = "El mismo valor en los tres lugares: el secret `TOKEN` del Worker (`npx wrangler secret put TOKEN` en `congreso-extractor/archivo/`) y el secret `CONGRESO_ARCHIVO_TOKEN` de los repos `congreso-extractor` y `supervisor`."
guardar = "gh secret set CONGRESO_ARCHIVO_TOKEN -R OpenCodice/supervisor"

[[credenciales]]
nombre = "EGRESS_MX_TOKEN"
que = "Token compartido con el Worker `egress-mx` (su secret `TOKEN`), secret de la organización. El supervisor lee con él `GET /salud` (I10); las vigilancias lo usan para descargar desde México las fuentes que rechazan conexiones de fuera."
necesita = "El mismo valor en los dos lugares: el secret `TOKEN` del Worker (`npx wrangler secret put TOKEN` en `constitucion-extractor/egress-mx/`) y el secret `EGRESS_MX_TOKEN` de la organización OpenCodice, visible para sus repositorios."
guardar = "gh secret set EGRESS_MX_TOKEN --org OpenCodice --visibility all"

# ---------------------------------------------------------------------------
# Reparación de infraestructura con un agente (reparar-infra.yml).
#
# Una huella determinista cuyo repo no está en `repos` queda `agotada` sin
# gastar sesión: ni este repo (que tiene su propio modo, `[reparacion.propio]`),
# ni las webs, ni los repos de datos.
# Las rutas son globs: `*` no cruza `/`, `**` sí.
#
# permitidos  lo que el arreglo puede modificar (archivos que ya existen).
# nuevos      lo único que puede crear: pruebas.
# workers     carpetas de Workers de Cloudflare que se despliegan solos.
# prohibidos  gana sobre lo anterior, en cualquier repo. Además, ninguna
#             prueba que ya exista se puede modificar.
# ---------------------------------------------------------------------------

[reparacion]
workflow = "reparar-infra.yml"
# Apagado, la política no lanza al agente: una huella determinista queda
# `agotada` con ese motivo (constancia en un issue) y, al encenderlo, la toma.
# Un ensayo a mano (`-f ensayo=true`) no depende de esto.
activa = true
max_archivos = 4
max_lineas = 120
# En un job con secretos o con permiso de escritura, líneas de `run:` que el
# arreglo puede cambiar por paso.
max_lineas_paso_con_poder = 6
# En esos mismos jobs, pasos cuyo `if:` puede estrechar un arreglo (el `if:`
# anterior intacto, con una guarda unida por `&&`). Solo vale en el paso de la
# huella, así que en la práctica es un interruptor: 0 lo apaga.
max_if_con_poder = 1
timeout_max_min = 355
# Horas que se espera el resultado de una sesión antes de darla por perdida.
sesion_max_h = 4
# Horas que tiene la corrida de prueba para pasar el paso de la huella.
prueba_max_h = 12
# "lista": un script que corre en un paso con secretos se puede tocar si sus
# líneas nuevas pasan la lista de lo prohibido. "cerrado": no se puede tocar.
scripts_con_poder = "lista"
# Pasos que, además de las compuertas de cada workflow, tienen que quedar
# idénticos (expresiones regulares sobre el nombre del paso).
pasos_protegidos = ['(?i)compuerta', '(?i)\bgate\b', '(?i)no puede tocar', '(?i)^validar', '(?i)cerco']
prohibidos = [
  ".github/workflows/revisar-pr.yml",
  "extractor/**",
  "congreso/**",
  "verificaciones/**",
  "certs/**",
  "egress-mx/**",
  "**/pendientes.json",
  "**/brief*.md",
  "scripts/validar_pr.sh",
  "scripts/validar_commits.py",
  "scripts/trailers.py",
  "scripts/impacto.py",
  "scripts/impacto_corpus.py",
  "scripts/revision.py",
  "scripts/reparacion.py",
  "scripts/expansion.py",
  "scripts/regresion.py",
  "scripts/commits*.py",
  "scripts/agente/cerrar*.sh",
  "scripts/agente/publicar_registro.sh",
  # Llevan compuertas de fidelidad además de orquestación.
  "scripts/agente/reparar.sh",
  "scripts/agente/expandir.sh",
  "scripts/agente/impacto.sh",
  "scripts/agente/revision*.sh",
  "scripts/agente/compuertas_reparar.py",
  "scripts/agente/proxy_mx.py",
]

# El propio supervisor (reparar-infra.yml con `huella=supervisor`). Lo lanza el
# Worker scheduler cuando supervisor.yml lleva tres corridas fallidas: roto, el
# reconciliador no puede observarse ni leer su estado, así que este modo no
# depende de `estado/` y sus topes se cuentan en la API.
#
# workflow          el que se repara y con el que se comprueba el arreglo.
# max_por_dia       corridas de este modo en 24 h (por el título de la corrida).
# verificar_max_min minutos que se espera la siguiente corrida del workflow
#                   tras publicar; si falla o no termina, el arreglo se revierte.
# informe_max_s     segundos de la vuelta de prueba en modo informe.
# permitidos, nuevos, prohibidos   como arriba. Ninguna prueba ni dato de
#                   prueba que ya exista cambia; lo que juzga un arreglo (las
#                   compuertas, este flujo, los encargos) no se toca.
# secciones_fijas   tablas de este archivo que un arreglo no puede cambiar: todas
#                   menos `workflows`. Las demás deciden los topes, a dónde se
#                   manda cada token y qué puede tocar el agente.
[reparacion.propio]
workflow = "supervisor.yml"
max_por_dia = 2
verificar_max_min = 40
informe_max_s = 600
permitidos = ["supervisor/*.py", ".github/workflows/supervisor.yml", "cadenas.toml"]
nuevos = ["tests/test_*.py", "tests/fixtures/**"]
prohibidos = [
  "supervisor/compuertas.py",
  "supervisor/reparar.py",
  "supervisor/lint_workflows.py",
  "supervisor/rutas.py",
  "supervisor/cadenas.py",
  ".github/workflows/reparar-infra.yml",
  ".github/workflows/tests.yml",
  "scripts/**",
  "estado/**",
]
secciones_fijas = ["general", "estado", "invariantes", "politica", "firmas", "datos", "repos", "web", "workers", "credenciales", "reparacion"]

[[reparacion.repos]]
nombre = "constitucion-extractor"
permitidos = [".github/workflows/*.yml", "scripts/lanzar_*.sh", "scripts/agente/*.sh", "scheduler/**"]
nuevos = ["tests/test_infra_*.py", "scheduler/*.test.mjs"]
workers = ["scheduler"]

[[reparacion.repos]]
nombre = "fiscal-extractor"
permitidos = [".github/workflows/*.yml", "scripts/lanzar_*.sh", "scripts/agente/*.sh"]
nuevos = ["tests/test_infra_*.py"]

[[reparacion.repos]]
nombre = "congreso-extractor"
permitidos = [".github/workflows/*.yml", "scripts/lanzar_*.sh", "scripts/agente/*.sh", "archivo/**"]
nuevos = ["tests/test_infra_*.py", "archivo/*.test.mjs"]
workers = ["archivo"]
