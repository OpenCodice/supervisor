  { paso = "Validar invariantes y commits en la cabeza del PR (GATE)" },
  { paso = "Fusionar si quedó validado y es de datos", firma = "no pasó la validación" },
]

# Cuando tiene trabajo comparte grupo con la actualización que publica: se
# declara para que la regla del único lanzador vea su lugar de espera. Lo
# dispara workflow_run; I11 lo cubre.
[[workflows]]
repo = "congreso-extractor"
archivo = "resolver-residuos.yml"
grupo = "actualizar-congreso"
solo_grupo = true

# Lo dispara workflow_run (I11 lo cubre). Se declara porque, al publicar un
# arreglo de los parsers, pide la actualización que lo aprovecha.
[[workflows]]
repo = "congreso-extractor"
archivo = "reparar-parsers.yml"
grupo = "reparar-parsers"
solo_grupo = true
puede_pedir = ["actualizar-congreso.yml"]

# Lo lanza I8 cuando un repo de datos avanza; un despliegue que falla tiene
# dueño como cualquier otra corrida (I2).
[[workflows]]
repo = "constitucion-web"
archivo = "deploy.yml"
grupo = "deploy"
cancela_en_curso = true
inputs = []
relanzar_sin_inputs = true
max_min = 30

# El agente de infraestructura. Se declara para que la regla del único lanzador
# vea su lugar de espera; I4 cancela una corrida colgada e I11 deja constancia
# si lleva tres en rojo (este workflow no se repara a sí mismo).
[[workflows]]
repo = "supervisor"
archivo = "reparar-infra.yml"
grupo = "reparar-infra"
solo_grupo = true
# La suma de los límites de sus jobs, con el que espera la corrida de prueba al
# reparar al propio supervisor.
max_min = 300

# ---------------------------------------------------------------------------
# Repos de datos. `main` de cada uno entra en I8; sus PR automáticos, en I5.
#
# rama        expresión regular de la rama del PR.
# vigilancia  el workflow que abre ese PR: mientras tenga una corrida viva, el
#             PR no está atorado; al cerrarlo, se relanza.
# revisor     revisar-pr.yml que lo valida y fusiona (el único que fusiona).
# ---------------------------------------------------------------------------

[[datos]]
