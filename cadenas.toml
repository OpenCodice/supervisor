  { etiqueta = "verificado", rama = '^datos/', vigilancia = { repo = "congreso-extractor", archivo = "actualizar-congreso.yml", inputs = { publicar = "si" } }, revisor = { repo = "congreso-extractor", archivo = "revisar-pr.yml" } },
]

