# Lo declarado: qué se vigila y con qué límites. El código de supervisor/ no
# conoce ningún workflow por nombre; todo sale de aquí.

[general]
org = "OpenCodice"
repo_supervisor = "supervisor"
# Días de corridas que entran en la foto. Cubre la ventana más larga que se
# evalúa con la lista (8 días); las más largas piden su última exitosa aparte.
dias_foto = 9
# Corridas sin éxito por repo cuyos jobs se leen en cada vuelta, de la más
# nueva a la más vieja.
max_corridas_con_jobs = 40
lineas_log = 40
# Artefactos `cadena` que se bajan por vuelta (los ya leídos están en el caché);
# si hay más, los más viejos esperan a la vuelta siguiente.
max_cadenas_por_vuelta = 60

[estado]
# Días que se conservan en estado/acciones.jsonl las acciones y en
# estado/huellas.jsonl las huellas resueltas que dejaron rastro (un issue, una
# reparación). Lo anterior se recorta en cada vuelta; el historial de git lo
# guarda. No puede ser menor que las ventanas que la política cuenta en la
# bitácora (intentos_agente_caducan_dias, rechazo_vigente_h, dias_foto).
conservar_dias = 30

[invariantes]
I1 = true    # cadencia
I2 = true    # toda falla tiene dueño
I3 = true    # nada se pierde en la cola
I4 = true    # nada se atora
I5 = true    # ningún PR automático queda abierto
I6 = true    # trabajo pendiente declarado
# Apagado: lo sustituyen las peticiones (I12). El job que publica un arreglo del
# extractor pide su vigilancia con los inputs justos; encendido, cada arreglo
# lanzaría además una vigilancia completa.
I7 = false   # extractor nuevo ⇒ reintento
I8 = true    # la web está al día
I9 = true    # los relojes viven
# Sin el token del Worker en el entorno sale «sin-observar», no «ok».
I10 = true   # los Workers avanzan
I11 = true   # rojo crónico
I12 = true   # toda petición se atiende
I13 = true   # las credenciales siguen vigentes

[politica]
# Horas de espera antes de cada reintento, según cuántas veces seguidas se ha
# visto la misma huella.
espera_transitoria_h = [1, 6, 24]
espera_desconocida_h = [1]
espera_determinista_h = [0]
# Entre lanzamientos por cadencia (I1) mientras no haya una corrida exitosa.
espera_cadencia_h = [1, 6, 24]
# Tiempo que se le da a un lanzamiento para aparecer en la lista de corridas.
gracia_lanzamiento_min = 30
# Lanzamientos seguidos sobre la misma corrida sin que aparezca una nueva.
max_lanzamientos_por_corrida = 3
# Cortacircuitos: lanzamientos del supervisor a un mismo workflow en 24 h.
max_lanzamientos_24h = 12
intentos_agente_por_huella = 2
sesiones_agente_por_dia = 3
# Los intentos del agente más viejos que esto ya no cuentan: una huella agotada
# vuelve a tener agente si sigue apareciendo.
intentos_agente_caducan_dias = 28
# Una huella que agotó al agente y sigue apareciendo vuelve a él, con los
# intentos en cero, cuando cambia en main el workflow de la huella o un script
# de infraestructura de su repo, cuando cambian las compuertas o el encargo del
# agente, o pasados estos días. A lo más `revividas_por_huella` veces.
revivir_dias = 7
revividas_por_huella = 3
en_cola_max_min = 120
pr_abierto_max_min = 90
web_margen_min = 15
cronico_corridas = 3
relojes_max_h = 3
# Minutos después de su hora en que todavía se lanza lo que tocaba por horario
# (pasados, lo retoma la cadencia). No aplica a quien declara `espera_libre`.
tolerancia_horario_min = 180
# Horas que un sitio de un Worker puede tener pendientes sin bajar nada (I10).
worker_pendiente_max_h = 6
# Horas seguidas que un Worker puede pasar sin contestar su /salud (o diciendo
# que no está sano, o que sale desde otro país) antes de dejar constancia: un
# despliegue, o un /salud que todavía no existe en la versión desplegada, no
# son un defecto. Mientras tanto I10 sale rota en el latido, sin issue.
worker_sin_salud_max_h = 6
# Días antes del vencimiento de una credencial en que I13 empieza a avisar, y
# cada cuántos días repite el aviso en su issue mientras nadie la renueve.
aviso_vencimiento_dias = 30
aviso_repeticion_dias = 7
# Horas que un 401/403 de una acción (un lanzamiento, un cierre) sigue contando
# como permiso perdido si ninguna acción igual sobre ese repo salió bien después.
rechazo_vigente_h = 192

[firmas]
# Expresiones regulares sobre la firma normalizada (sin distinguir mayúsculas).
transitorias = [
  'Connection refused',
  'Connection reset',
  'timed out',
  'IncompleteRead',
  'HTTP (Error )?5\d\d',
  '\b429\b',
  'curl: \((6|7|28|35|56)\)',
  'rate limit',
  'usage limit',
  'Temporary failure in name resolution',
  # «Alertar fuentes fallidas»: un sitio oficial que no respondió.
  'fuente no se pudo (resolver o )?descargar',
]
# Una credencial vencida o por vencer (`credenciales.yml` y su
# `scripts/vencimiento.py`): no se reintenta ni va al agente de
# infraestructura; queda constancia en un issue, con el error tal cual.
credenciales = [
  'Credencial por renovar',
]
deterministas = [
  'exit code 127',
  'No such file or directory',
  'command not found',
  'unbound variable',
  'HTTP 422',
  'Invalid workflow file',
  'startup_failure',
  'permission denied',
]

# ---------------------------------------------------------------------------
# Workflows vigilados.
#
# grupo            grupo de concurrency (por repo): quien lo comparte, comparte
#                  el único lugar de espera.
# grupos           casos en que el grupo depende de los inputs.
# inputs           los que declara, en el orden del run-name del contrato.
# inputs_lista     listas separadas por espacio; vacío = todo, que abarca
#                  cualquier lista. Se pueden unir.
# inputs_uno       un valor o vacío = todos; dos valores distintos se unen en
#                  vacío.
# inputs_ignorados no cambian qué trabajo hace la corrida.
# inputs_manuales  con un valor distinto del de omisión es una prueba a mano:
#                  ni se relanza ni cuenta para la cadencia.
# omision          valor por omisión de los que no son cadena vacía.
# relanzar_sin_inputs  una corrida de inputs desconocidos (anterior al
#                  contrato, push, schedule) se puede relanzar sin inputs.
# encadenado       cumple el contrato: `run-name` con sus inputs y job final
#                  `estado pendiente=[…]` (I6), que sube el artefacto `cadena`.
# puede_pedir      workflows que una corrida suya puede pedir por una salida
#                  `pedir*` (I12): `archivo.yml` de su repo o `repo/archivo.yml`.
#                  Una petición a otro destino solo deja constancia.
# cadencias        I1: cada una exige una corrida exitosa dentro de su ventana
#                  con esos inputs.
# horario          cuándo toca lanzarlo (UTC): `dias` por nombre (lun…dom, `*`),
#                  `dia_mes` (1–28), `hora` "HH:MM" o "*:MM" (cada hora) e
#                  `inputs`. Solo cuenta la cita más reciente: lo atrasado no se
#                  acumula. Con lanza_horario = false solo se documenta.
# espera_libre     workflows de su repo que tienen que estar sin corridas vivas
#                  y sin PR automático abierto para lanzarlo por horario; la
#                  cita espera hasta la siguiente en vez de caducar.
# max_min          minutos que una corrida puede estar en curso (I4).
# compuertas       pasos que fallan a propósito por los datos o por el
#                  extractor: clase `datos`, el supervisor no los toca. Con
#                  `firma`, solo si la firma casa.
# extractor_nuevo  I7: se relanza cuando main cambia en estas rutas después
#                  del inicio de su última corrida exitosa.
# ---------------------------------------------------------------------------

[[workflows]]
repo = "constitucion-extractor"
archivo = "vigilar-cpeum.yml"
grupo = "vigilar-constitucion-mexicana"
inputs = ["origen"]
inputs_ignorados = ["origen"]
relanzar_sin_inputs = true
encadenado = true
cadencias = [{ ventana_h = 192 }]
horario = [{ dias = ["lun"], hora = "09:00" }]
lanza_horario = true
max_min = 420
compuertas = [
  { paso = "Compuertas del arreglo del agente" },
  { paso = "Validar invariantes y trailers en la cabeza del PR (GATE)" },
  { paso = "Publicar el check y fusionar si quedó verificado", firma = "no pasó la validación" },
]

