  { etiqueta = "automatico", rama = '^reforma/leyes-estatales$', prefijo = "reforma/", vigilancia = { repo = "fiscal-extractor", archivo = "vigilar-leyes-estatales.yml" }, revisor = { repo = "fiscal-extractor", archivo = "revisar-pr.yml" } },
]

[[datos]]
